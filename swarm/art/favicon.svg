<!-- DeskVNC favicon: the logomark reduced to a square tile, legible at 16 pixels. -->
<svg xmlns="http://www.w3.org/2000/svg" class="dv-art" viewBox="0 0 32 32" preserveAspectRatio="xMidYMid meet" role="img" aria-label="DeskVNC">
  <title>DeskVNC</title>
  <style>
    .dv-art {
      --dv-tile: #0a58c2;
      --dv-mark: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      .dv-art {
        --dv-tile: #74b0ff;
        --dv-mark: #06121f;
      }
    }
  </style>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="var(--dv-tile)"/>
  <g fill="none" stroke="var(--dv-mark)" stroke-width="3" stroke-linecap="round">
    <path d="M26.5 13V10.5Q26.5 6.5 22.5 6.5H9.5Q5.5 6.5 5.5 10.5V21.5Q5.5 25.5 9.5 25.5H22.5Q26.5 25.5 26.5 21.5V19"/>
    <path d="M13.5 10L23.5 16 13.5 22" stroke-width="3.8" stroke-linejoin="miter"/>
  </g>
</svg>