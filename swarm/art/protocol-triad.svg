<!-- DeskVNC protocol triad: three distinct protocol cores, VNC, RDP and SSH, feeding one unified client window. -->
<svg xmlns="http://www.w3.org/2000/svg" class="dv-art" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Three distinct protocol cores, VNC as a round framebuffer core, RDP as a square window of panes, and SSH as a stacked terminal core, converge on one DeskVNC client window whose tabs cycle between all three">
  <title>Three protocol cores, one client window</title>
  <style>
    .dv-art {
      --dv-bg: #fbfcfd;
      --dv-panel: #f2f5f8;
      --dv-panel-2: #e9eef3;
      --dv-ink: #12161c;
      --dv-ink-2: #414b57;
      --dv-ink-3: #5d6875;
      --dv-rule: #ccd5de;
      --dv-rule-2: #9aa7b4;
      --dv-accent: #0a58c2;
      --dv-accent-line: rgba(10, 88, 194, 0.32);
      --dv-accent-soft: rgba(10, 88, 194, 0.09);
      --dv-focus: #b1450a;
      --dv-grid: rgba(18, 22, 28, 0.055);
      --dv-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      .dv-art {
        --dv-bg: #0c0f13;
        --dv-panel: #131820;
        --dv-panel-2: #090c10;
        --dv-ink: #e6ecf3;
        --dv-ink-2: #b0bcc9;
        --dv-ink-3: #8e9baa;
        --dv-rule: #2c3641;
        --dv-rule-2: #4a5764;
        --dv-accent: #74b0ff;
        --dv-accent-line: rgba(116, 176, 255, 0.34);
        --dv-accent-soft: rgba(116, 176, 255, 0.13);
        --dv-focus: #ffb057;
        --dv-grid: rgba(230, 236, 243, 0.05);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion, set { display: none; }
    }
    .dv-pulse { stroke-dasharray: 7 93; opacity: 0; }
    .dv-lbl {
      font-family: var(--dv-mono);
      font-size: 15px;
      letter-spacing: 0.14em;
      fill: var(--dv-ink-2);
      text-anchor: middle;
    }
    .dv-lbl-md {
      font-family: var(--dv-mono);
      font-size: 13px;
      letter-spacing: 0.1em;
      fill: var(--dv-ink-2);
    }
    .dv-lbl-sm {
      font-family: var(--dv-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      fill: var(--dv-ink-3);
    }
    .dv-metric { fill: var(--dv-ink-3); }
    .dv-on-focus { fill: var(--dv-focus); }
  </style>

