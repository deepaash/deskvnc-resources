<!-- DeskVNC four call loop: hosts, open, control, screen, act, and the return that makes it a loop. -->
<svg xmlns="http://www.w3.org/2000/svg" class="dv-art" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The agent loop in five stages: list hosts, open a machine, take control, read the screen, then click and type, returning to read the screen again in nineteen milliseconds">
  <title>The observe then act loop</title>
  <style>
    .dv-art {
      --dv-bg: #fbfcfd;
      --dv-panel: #f2f5f8;
      --dv-panel-2: #e9eef3;
      --dv-ink: #12161c;
      --dv-ink-2: #414b57;
      --dv-ink-3: #5d6875;
      --dv-rule: #ccd5de;
      --dv-rule-2: #9aa7b4;
      --dv-accent: #0a58c2;
      --dv-accent-line: rgba(10, 88, 194, 0.32);
      --dv-accent-soft: rgba(10, 88, 194, 0.09);
      --dv-grid: rgba(18, 22, 28, 0.055);
      --dv-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      .dv-art {
        --dv-bg: #0c0f13;
        --dv-panel: #131820;
        --dv-panel-2: #090c10;
        --dv-ink: #e6ecf3;
        --dv-ink-2: #b0bcc9;
        --dv-ink-3: #8e9baa;
        --dv-rule: #2c3641;
        --dv-rule-2: #4a5764;
        --dv-accent: #74b0ff;
        --dv-accent-line: rgba(116, 176, 255, 0.34);
        --dv-accent-soft: rgba(116, 176, 255, 0.13);
        --dv-grid: rgba(230, 236, 243, 0.05);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion, set { display: none; }
    }
    .dv-pulse { stroke-dasharray: 7 93; }
    .dv-lbl {
      font-family: var(--dv-mono);
      font-size: 15px;
      letter-spacing: 0.14em;
      fill: var(--dv-ink-2);
      text-anchor: middle;
    }
    .dv-metric { fill: var(--dv-ink-3); }
  </style>

  <g class="dv-lbl">
    <text x="160" y="48">HOSTS</text>
    <text x="380" y="48">OPEN</text>
    <text x="600" y="48">CONTROL</text>
    <text x="820" y="48">SCREEN</text>
    <text x="1040" y="48">ACT</text>
  </g>

  <g id="dv-rail" fill="none" stroke="var(--dv-rule)" stroke-width="1.5">
    <path d="M224 128H316"/>
    <path d="M444 128H536"/>
    <path d="M664 128H756"/>
    <path d="M884 128H976"/>
  </g>
  <g id="dv-rail-run" fill="none" stroke="var(--dv-accent)" stroke-width="4" stroke-linecap="round">
    <path class="dv-pulse" d="M224 128H316" pathLength="100" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;100;100" keyTimes="0;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path class="dv-pulse" d="M444 128H536" pathLength="100" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;0;100;100" keyTimes="0;0.2;0.4;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.24;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path class="dv-pulse" d="M664 128H756" pathLength="100" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;0;0;100;100" keyTimes="0;0.2;0.4;0.6;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.44;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path class="dv-pulse" d="M884 128H976" pathLength="100" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;0;0;0;100;100" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;0.84;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="var(--dv-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 121L316 128 306 135"/>
    <path d="M526 121L536 128 526 135"/>
    <path d="M746 121L756 128 746 135"/>
    <path d="M966 121L976 128 966 135"/>
  </g>

  <g id="dv-return">
    <path d="M1040 192Q930 470 820 192" fill="none" stroke="var(--dv-accent-line)" stroke-width="2" stroke-linecap="round"/>
    <path class="dv-pulse" d="M1040 192Q930 470 820 192" pathLength="100" fill="none" stroke="var(--dv-accent)" stroke-width="4" stroke-linecap="round" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;100;100" keyTimes="0;0.8;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.85;0.95;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M830 203L820 192 820 207" fill="none" stroke="var(--dv-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="dv-lbl dv-metric" x="930" y="356" style="font-size:16px;letter-spacing:0.1em">19 ms</text>
  </g>

  <g id="dv-stage-hosts" transform="translate(160 128)">
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="var(--dv-panel)" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="none" stroke="var(--dv-accent)" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="1;0.08;0.08;0.08;0.08;0.5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <g fill="none" stroke="var(--dv-rule)" stroke-width="1.5">
      <rect x="-44" y="-39" width="88" height="18" rx="3"/>
      <rect x="-44" y="-9" width="88" height="18" rx="3"/>
      <rect x="-44" y="21" width="88" height="18" rx="3"/>
    </g>
    <rect x="-36" y="-34" width="8" height="8" rx="2" fill="var(--dv-accent)"/>
    <rect x="-20" y="-32.5" width="30" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
    <rect x="14" y="-32.5" width="22" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
    <rect x="-36" y="-4" width="8" height="8" rx="2" fill="var(--dv-rule-2)"/>
    <rect x="-20" y="-2.5" width="30" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
    <rect x="14" y="-2.5" width="22" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
    <rect x="-36" y="26" width="8" height="8" rx="2" fill="var(--dv-rule-2)"/>
    <rect x="-20" y="28.5" width="30" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
    <rect x="14" y="28.5" width="22" height="5" rx="2.5" fill="var(--dv-rule-2)"/>
  </g>

  <g id="dv-stage-open" transform="translate(380 128)">
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="var(--dv-panel)" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="none" stroke="var(--dv-accent)" stroke-width="2" opacity="0.12">
      <animate attributeName="opacity" values="0.12;1;0.08;0.08;0.08;0.12" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <g fill="var(--dv-panel-2)" stroke="var(--dv-rule)" stroke-width="1.5" stroke-linejoin="round">
      <path d="M-48 -36L-14 -17V17L-48 36Z"/>
      <path d="M48 -36L14 -17V17L48 36Z"/>
    </g>
    <path d="M0 -16L16 0 0 16 -16 0Z" fill="var(--dv-accent)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="0.48s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="dv-stage-control" transform="translate(600 128)">
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="var(--dv-panel)" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="none" stroke="var(--dv-accent)" stroke-width="2" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.12;1;0.08;0.08;0.12" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle r="40" fill="none" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <path d="M0 0L-20 -34.6A40 40 0 0 1 34.6 20Z" fill="var(--dv-accent-soft)" stroke="var(--dv-accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-10 -17.3L-18 -31.2" fill="none" stroke="var(--dv-accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0L34.6 20" fill="none" stroke="var(--dv-accent)" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="4" fill="var(--dv-accent)"/>
  </g>

  <g id="dv-stage-screen" transform="translate(820 128)">
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="var(--dv-panel)" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="none" stroke="var(--dv-accent)" stroke-width="2" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.12;0.12;1;0.08;0.12" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M-48 0Q0 -44 48 0Q0 44 -48 0Z" fill="var(--dv-accent-soft)" stroke="var(--dv-accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle r="15" fill="var(--dv-accent)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.5;0.5;1;0.5;0.5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g id="dv-stage-act" transform="translate(1040 128)">
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="var(--dv-panel)" stroke="var(--dv-rule)" stroke-width="1.5"/>
    <rect x="-64" y="-64" width="128" height="128" rx="8" fill="none" stroke="var(--dv-accent)" stroke-width="2" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.12;0.12;0.12;1;0.5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M-52 -20L-52 15.2 -42.1 6.4 -34.4 21.8 -26.7 18.5 -34.4 4.2 -21.2 4.2Z" fill="var(--dv-accent-soft)" stroke="var(--dv-accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-8 4H8M0 -4V12" fill="none" stroke="var(--dv-rule-2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 24H62" fill="none" stroke="var(--dv-rule)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="21" y="-12" width="9" height="36" rx="2" fill="var(--dv-accent)">
      <animate attributeName="opacity" values="1;1;1;1;1;0.15;1" keyTimes="0;0.2;0.4;0.6;0.8;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>