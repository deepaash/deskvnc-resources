<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">DeskVNC, a 19 millisecond observe-then-act cycle</title>
  <desc id="d">Social card. The headline figure 19 ms is the observe-then-act cycle DeskVNC publishes in its README, measured on a 1920x1080 Windows desktop over LAN. A readout panel beside it lists the desktop under test, the transport, and the 52 actions per second the README states alongside the cycle figure. Nothing is plotted.</desc>
  <style>
.bg      { fill: #fbfcfd; }                 /* --bg */
.bg-sub  { fill: #f2f5f8; }                 /* --bg-subtle */
.bg-ins  { fill: #e9eef3; }                 /* --bg-inset */
.fg      { fill: #12161c; }                 /* --fg */
.fg-mut  { fill: #414b57; }                 /* --fg-muted */
.fg-fai  { fill: #5d6875; }                 /* --fg-faint */
.acc     { fill: #0a58c2; }                 /* --accent */
.sig     { fill: #1a6f42; }                 /* --signal */
.s-border { stroke: #ccd5de; fill: none; }  /* --border */
.s-acc   { stroke: #0a58c2; fill: none; }  /* --accent */
.s-grid  { stroke: #12161c; stroke-opacity: 0.055; fill: none; } /* --grid-line */
.sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
.mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", SFMono-Regular,
        Menlo, Consolas, "Liberation Mono", monospace; }
.lbl { letter-spacing: 0.09em; }            /* --tracking-label */
.tight { letter-spacing: -0.02em; }         /* --tracking-tight */
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" class="s-grid" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbfcfd" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" class="bg"/>
  <rect x="0" y="0" width="1200" height="500" fill="url(#grid)"/>
  <rect x="0" y="360" width="1200" height="270" fill="url(#fade)"/>
  <rect x="80" y="108" width="56" height="4" class="acc"/>
  <text x="152" y="120" class="mono fg-mut lbl" font-size="13" letter-spacing="0.09em">MEASURED LATENCY</text>
  <text x="1120" y="120" class="mono fg lbl" font-size="13" text-anchor="end" letter-spacing="0.04em">DeskVNC</text>
  <circle cx="1046" cy="116" r="4" class="sig"/>
  <line x1="80" y1="152" x2="1120" y2="152" class="s-border" stroke-width="1"/>
  <text x="80" y="420" class="mono fg tight" font-size="210" letter-spacing="-0.02em">19</text>
  <text x="348" y="420" class="mono fg-fai tight" font-size="76" letter-spacing="-0.02em">ms</text>
  <text x="80" y="486" class="sans fg" font-size="24">one observe-then-act cycle, about 52 actions per second</text>
  <text x="80" y="522" class="sans fg-mut" font-size="14">Measured on a 1920x1080 Windows desktop over LAN, from the DeskVNC README</text>
  <circle cx="84" cy="547" r="4" class="sig"/>
  <text x="100" y="551" class="mono fg-mut" font-size="13">Published benchmark, v0.27.11 shipped 2026-10-08</text>
  <rect x="740" y="240" width="380" height="196" rx="4" class="bg-sub"/>
  <rect x="740" y="240" width="380" height="196" rx="4" class="s-border" stroke-width="1"/>
  <line x1="740" y1="284" x2="1120" y2="284" class="s-border" stroke-width="1"/>
  <text x="760" y="268" class="mono fg-fai lbl" font-size="11" letter-spacing="0.09em">READOUT</text>
  <text x="760" y="324" class="sans fg-mut" font-size="15">Desktop under test</text>
  <text x="1100" y="324" class="mono fg" font-size="16" text-anchor="end">1920x1080</text>
  <line x1="740" y1="348" x2="1120" y2="348" class="s-border" stroke-width="1"/>
  <text x="760" y="374" class="sans fg-mut" font-size="15">Transport</text>
  <text x="1100" y="374" class="mono fg" font-size="16" text-anchor="end">Windows, LAN</text>
  <line x1="740" y1="398" x2="1120" y2="398" class="s-border" stroke-width="1"/>
  <text x="760" y="424" class="sans fg-mut" font-size="15">Actions per second</text>
  <text x="1100" y="424" class="mono fg" font-size="16" text-anchor="end">52</text>
</svg>
